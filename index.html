<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>JPY to TWD</title>
  <meta name="theme-color" content="#7b6ba8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="匯率">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <span class="logo" id="header-logo">¥</span>
      <div class="title-group">
        <h1 id="header-title">JPY → TWD</h1>
        <p class="subtitle">Convert to New Taiwan Dollar</p>
      </div>
    </header>

    <main>
      <div class="currency-toggle">
        <button class="toggle-btn active" data-currency="JPY">¥ JPY</button>
        <button class="toggle-btn" data-currency="USD">$ USD</button>
      </div>

      <div class="input-group">
        <label for="amount-input" id="input-label">Amount in JPY</label>
        <div class="input-wrapper">
          <span class="currency-prefix" id="input-prefix">¥</span>
          <input type="text" inputmode="decimal" autocomplete="off" id="amount-input" placeholder="0" />
        </div>
      </div>

      <div class="action-row">
        <div class="custom-adjust">
          <label class="checkbox-label">
            <input type="checkbox" id="custom-checkbox" />
            <span class="checkbox-custom"></span>
          </label>
          <button type="button" id="sign-btn" class="sign-btn" title="切換正負">±</button>
          <input type="text" inputmode="decimal" autocomplete="off" id="custom-pct" placeholder="0" />
          <span class="checkbox-text pct-sign">%</span>
        </div>
        <label class="checkbox-label">
          <input type="checkbox" id="minus10-checkbox" />
          <span class="checkbox-custom"></span>
          <span class="checkbox-text">-10%</span>
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="plus10-checkbox" />
          <span class="checkbox-custom"></span>
          <span class="checkbox-text">+10%</span>
        </label>
      </div>

      <div class="result-wrapper">
        <span class="currency-prefix result-prefix">NT$</span>
        <input type="text" inputmode="decimal" autocomplete="off" id="ntd-input" class="result-value" placeholder="0" />
      </div>
    </main>

    <footer>
      <div class="rate-info">
        <span id="rate-text" class="rate-text">Fetching rate…</span>
        <span id="rate-time" class="rate-time"></span>
      </div>
      <button id="refresh-btn" class="refresh-btn" title="Refresh rate">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="23 4 23 10 17 10"></polyline>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
        </svg>
      </button>
    </footer>

    <div id="error-banner" class="error-banner hidden">
      <span id="error-msg"></span>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
